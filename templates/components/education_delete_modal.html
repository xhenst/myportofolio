<div class="education-delete-wrapper">
    <button type="button"
            class="button btn-education-delete-trigger"
            popovertarget="delete-education-{{ education.id }}"
            aria-label="Hapus {{ education.title }}"
            title="Hapus">
        Hapus
    </button>
</div>
<div id="delete-education-{{ education.id }}"
     class="education-delete-modal education-delete-modal-custom"
     popover="auto">
    <button type="button"
            class="education-delete-modal__backdrop education-delete-backdrop-custom"
            popovertarget="delete-education-{{ education.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="education-delete-box">
        <button type="button"
                class="education-delete-close-btn"
                popovertarget="delete-education-{{ education.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">
            &times;
        </button>
        
        <h2 class="education-delete-title">Hapus</h2>
        <p class="education-delete-desc">
            Apakah Anda yakin ingin menghapus <br>
            <strong class="education-delete-item-title">{{ education.title }}</strong>?
        </p>
        <div class="education-delete-actions">
            <button type="button"
                    class="button btn-education-cancel"
                    popovertarget="delete-education-{{ education.id }}"
                    popovertargetaction="hide">Batal</button>
                
            <form method="post" action="{% url 'main:delete_education' education.id %}" class="form-education-delete-wrapper">
                {% csrf_token %}
                <button type="submit" class="button btn-education-confirm-delete">
                    Ya, Hapus
                </button>
            </form>
        </div>
    </div>
</div>
