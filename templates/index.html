{% extends 'base.html' %}
{% load static %}
{% block meta %}
    <title>Profile - {{ name }}</title>
{% endblock meta %}

{% block content %}
<section class="tab-content active" id="profile">
    <div class="profile-layout">
        <div class="profile-text" style="margin-top: 3rem;">
            <p style="color: var(--accent); font-weight: bold; margin-bottom: 1rem; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.08em;">
                {{ study_program }} &middot; Universitas Indonesia
            </p>
            <h1 style="line-height: 1.2; color: #FFFFFF;">
             Hello, I'm <br>
             <span style="color: var(--accent);">{{ name }}</span>
            </h1>
            <h3 style="margin-top: 1.5rem; color: #FFFFFF; line-height: 1.8;">NPM: {{ npm }}</h3>
            <p style="margin-top: 1.5rem; color: #CCCCCC; line-height: 1.8;">
            {{ bio }}
            </p>
            <div class="social-links">
                <a href="https://github.com/xhenst" class="social-link">GitHub</a>
                <a href="https://www.linkedin.com/in/kaylalifahk/" class="social-link">LinkedIn</a>
                <a href="mailto:kaylalifahk@gmail.com" class="social-link">Email</a>
            </div>
        </div>
        
        <div class="photo-wrapper" style="margin-top: 3rem;">
            <div class="photo-backdrop"></div>
            <div class="photo-frame">
                <img src="{% static 'img/foto-kayla.png' %}" alt="Photo of {{ name }}">
            </div>
        </div>
    </div>
</section>
{% endblock content %}
