{% extends "base.html" %}
{% block meta %}
    <title>Add Education - {{ name }}</title>
    
    <!-- CSS Khusus Form gaya Project -->
    <style>
        .project-form {
            width: 100%;
            max-width: 100%;
            margin-top: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 700;
            color: var(--accent);
        }
        .form-group input, 
        .form-group textarea, 
        .form-group select {
            width: 100%;
            box-sizing: border-box;
            padding: 0.7rem;
            background-color: transparent;
            border: 1px solid var(--accent);
            border-radius: var(--radius);
            color: #FFFFFF;
            font: inherit;
            transition: border-color 0.2s ease, outline-color 0.2s ease;
        }
        .form-group input:focus, 
        .form-group textarea:focus {
            outline: 2px solid var(--accent);
            border-color: var(--accent);
            background-color: rgba(255, 255, 255, 0.02);
        }
        .form-error {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 0.35rem;
        }
        .button {
            display: inline-block;
            height: fit-content;
            border: 0;
            border-radius: var(--radius);
            padding: 0.65rem 1rem;
            background: var(--accent);
            color: white;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
        }
        .button-secondary {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--ink);
        }
    </style>
{% endblock meta %}

{% block content %}
<section class="tab-content active" style="margin-top: 3rem; max-width: 700px;">
    <h1 style="font-size: 2.5rem; margin-bottom: 1.5rem; color: #FFFFFF;">Add New Education</h1>
    
    <form method="post" action="{% url 'main:create_education' %}" class="project-form">
        {% csrf_token %}

        {% for field in form %}
            <div class="form-group">
                <label for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>

                <!-- Render Input Django -->
                {{ field }}

                {% for error in field.errors %}
                    <p class="form-error">{{ error }}</p>
                {% endfor %}
            </div>
        {% endfor %}

        <!-- Area Tombol Aksi -->
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="button">
                Tambah Education
            </button>
            
            <a href="{% url 'main:show_education' %}" class="button button-secondary" style="display: inline-flex; align-items: center; justify-content: center;">
                Batal
            </a>
        </div>
    </form>
</section>
{% endblock content %}
