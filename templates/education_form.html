{% extends "base.html" %}
{% block meta %}
    <title>Add Education - {{ name }}</title>
{% endblock meta %}

{% block content %}
<section class="tab-content active form-page-section">
    <h1 class="form-page-title">Add New Education</h1>
    
    <form method="post" action="{% url 'main:create_education' %}" class="custom-form-container">
        {% csrf_token %}

        {% for field in form %}
            <div class="form-group-item">
                <label for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>

                <!-- Render Input Django -->
                {{ field }}

                {% for error in field.errors %}
                    <p class="form-error-msg">{{ error }}</p>
                {% endfor %}
            </div>
        {% endfor %}

        <!-- Area Tombol Aksi -->
        <div class="form-actions-wrapper">
            <button type="submit" class="button">
                Tambah Education
            </button>
            
            <a href="{% url 'main:show_education' %}" class="button button-secondary btn-secondary-custom">
                Batal
            </a>
        </div>
    </form>
</section>
{% endblock content %}
